# Karaoke Propio — the stack, as published.
#
# This file names images and never builds them. It is meant to be downloaded
# on its own, next to a .env, and to work without cloning anything: from
# 2.9.0 the four images are published for linux/amd64 and linux/arm64, so
# `docker compose up -d` pulls what fits the machine.
#
# To build from source instead — the path for anyone changing the code — add
# the development override, which is the only place `build:` now lives:
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
#
# KP_TAG pins the version, deliberately. Upgrading is then something you do on
# purpose (raise KP_TAG, or take a newer copy of this file) rather than
# something a restart can do to you. Set KP_TAG=latest in .env for the
# opposite preference.

services:
  # Docker creates named volumes owned by root on first use; karaoke-propio
  # and pitch-worker both run as non-root (UID/GID 1000 by default — see
  # prompt_de_implementacion.md #45) and would fail to write to pitch-cache
  # otherwise. This one-shot init container fixes ownership once, then exits;
  # the real services wait for it via service_completed_successfully.
  #
  # It is the one service that must stay root: chown is its whole job, so the
  # `user:` line the other four carry would defeat it.
  pitch-cache-init:
    image: busybox:latest
    container_name: app-pitch-cache-init
    user: root
    command: ["sh", "-c", "chown -R ${PUID:-1000}:${PGID:-1000} /data/pitch-cache"]
    volumes:
      - pitch-cache:/data/pitch-cache

  karaoke-propio:
    image: ghcr.io/atumanera/karaoke-propio:${KP_TAG:-2.9.0}
    container_name: app-karaoke-propio
    restart: unless-stopped

    # The UID/GID the container runs as, at run time rather than baked in at
    # build time. A published image cannot carry anyone's UID — everybody
    # would receive this machine's 1000 — so the image defaults to 1000:1000
    # and this line is what makes PUID/PGID in .env mean anything. Docker
    # accepts a UID with no entry in the image's /etc/passwd; neither Node nor
    # .NET needs one, and the Dockerfiles set a writable HOME for that case.
    user: "${PUID:-1000}:${PGID:-1000}"

    # Measured, not guessed: a full scan of a 1786-song / 19 GB library peaks at
    # 199 MB of real (anonymous) memory for this container, server and scanner
    # process together, and that number no longer follows the size of the
    # largest file — media is streamed rather than buffered (see
    # docs/FEATURES.md, "Serving media without loading it"). 512 MB is roughly
    # 2.5x the measured peak.
    #
    # Most of what `docker stats` reports for this container is page cache from
    # streaming and scanning, not the process: it reached 3.7 GB right after a
    # scan. That memory is reclaimable and the limit simply bounds it. It costs
    # playback nothing — a song streams at ~3.4 Mbps and any disk is orders of
    # magnitude faster than that — and it is what makes this installable on a
    # VPS without the container appearing to eat the machine.
    #
    # memswap_limit is set to the same value on every service on purpose:
    # without it Docker allows an extra mem_limit's worth of swap, which turns
    # a clean OOM into an unpredictable slowdown.
    mem_limit: 512m
    memswap_limit: 512m

    ports:
      - "8080:8080"

    volumes:
      - ./ke-config:/config
      - ./songs:/mnt/karaoke
      - pitch-cache:/data/pitch-cache

    environment:
      # server timezone; affects log timestamps and any server-side formatting
      - TZ=${TZ:-America/Lima}
      - KES_PITCH_WORKER_URL=http://pitch-worker:4000
      - KES_PITCH_CACHE_DIR=/data/pitch-cache
      # How many pitch transcodes may run at once. Each one is an ffmpeg +
      # rubberband process, so this is the main CPU knob: raise it on a
      # stronger machine, lower it to 1 if playback stutters while a song is
      # being prepared.
      - KES_PITCH_MAX_CONCURRENCY=${PITCH_MAX_CONCURRENCY:-2}
      - KES_ACQUISITION_WORKER_URL=http://acquisition-worker:4100
      - KES_CDG_WORKER_URL=http://cdg-worker:4200
      # optional: enables USDB/UltraStar acquisition (requires an
      # authenticated USDB session even for search — see
      # server/Acquisition/UsdbClient.ts). Leave unset to disable that source;
      # YouTube acquisition works without it.
      - USDB_USERNAME=${USDB_USERNAME:-}
      - USDB_PASSWORD=${USDB_PASSWORD:-}

      # Public exposure. Set KARAOKE_DOMAIN in .env (comma-separated for
      # several names) and the existing nginx-proxy + acme-companion pick it
      # up automatically: virtual host, certificate and renewal, no extra
      # container. Left empty, all three are ignored and the app stays
      # LAN-only exactly as before.
      - VIRTUAL_HOST=${KARAOKE_DOMAIN:-}
      - LETSENCRYPT_HOST=${KARAOKE_DOMAIN:-}
      - VIRTUAL_PORT=8080
      # what the QR encodes; guests may be off the LAN, so it must be the
      # public name rather than whatever address the Player happens to be open at
      - KES_PUBLIC_URL=${KARAOKE_PUBLIC_URL:-}

    depends_on:
      pitch-cache-init:
        condition: service_completed_successfully
      pitch-worker:
        condition: service_started
      acquisition-worker:
        condition: service_started
      cdg-worker:
        condition: service_started

    networks:
      - nginx-proxy
      - karaoke-internal

  # FFmpeg + rubberband pitch shifting. Separate Debian-based service because
  # the application's Alpine image lacks the rubberband filter (see
  # prompt_de_implementacion.md #16). Never exposed — internal network only.
  pitch-worker:
    image: ghcr.io/atumanera/karaoke-propio-pitch-worker:${KP_TAG:-2.9.0}
    container_name: app-pitch-worker
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"

    # The Node process itself has never exceeded 103 MB here (VmHWM over 11
    # days of real jobs); the variable part is the ffmpeg + rubberband children,
    # KES_PITCH_MAX_CONCURRENCY of them at once. 1 GB is deliberately generous
    # because that peak was not measured under load — halve it if you also set
    # PITCH_MAX_CONCURRENCY=1, which is the setting for a small VPS.
    mem_limit: 1g
    memswap_limit: 1g

    volumes:
      - ./songs:/mnt/karaoke:ro
      - pitch-cache:/data/pitch-cache

    depends_on:
      pitch-cache-init:
        condition: service_completed_successfully

    networks:
      - karaoke-internal

  # yt-dlp + ffmpeg song acquisition from YouTube (see
  # prompt_de_implementacion.md #34). Separate from pitch-worker: different
  # responsibility (download vs. transcode) and different runtime needs
  # (Python for yt-dlp). Never exposed — internal network only. Needs
  # WRITE access to the library: it stages downloads under
  # <library>/_staging/<requestId>/ before AcquisitionManager atomically
  # publishes them.
  acquisition-worker:
    image: ghcr.io/atumanera/karaoke-propio-acquisition-worker:${KP_TAG:-2.9.0}
    container_name: app-acquisition-worker
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"

    # Node peaked at 84 MB over 4 days, but the real consumers are the yt-dlp
    # and ffmpeg children it spawns per download. Bulk import runs one song at a
    # time (see AcquisitionManager), so this bounds one download, not forty.
    mem_limit: 1g
    memswap_limit: 1g

    volumes:
      - ./songs:/mnt/karaoke

    networks:
      - karaoke-internal

  # UltraStar song.txt -> .cdg generation (vendored CDGSharp, MIT — see
  # cdg-worker/CDGSharp/LICENSE). Separate .NET runtime from the two Node
  # workers above. Never exposed — internal network only. It receives
  # already-valid .lrc TEXT over HTTP (not a path), but writes its .cdg
  # OUTPUT directly to the shared library path (same convention as
  # pitch-worker/acquisition-worker), since AcquisitionManager gives it an
  # absolute path under <library>/_staging/<requestId>/.
  cdg-worker:
    image: ghcr.io/atumanera/karaoke-propio-cdg-worker:${KP_TAG:-2.9.0}
    container_name: app-cdg-worker
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"

    # .NET, and the smallest of the four: 75 MB peak over 12 days. It renders
    # one .cdg from a text file. .NET reads the cgroup limit and sizes its heap
    # against it, so a low ceiling here is a feature.
    mem_limit: 256m
    memswap_limit: 256m

    volumes:
      - ./songs:/mnt/karaoke

    networks:
      - karaoke-internal

networks:
  nginx-proxy:
    external: true
  # pitch-worker and acquisition-worker are reachable ONLY from
  # karaoke-propio on this network — neither has a ports: mapping, and
  # neither is attached to nginx-proxy, so neither is reachable from the
  # host or the internet. This is deliberately NOT marked internal:true:
  # acquisition-worker needs outbound internet access to reach YouTube via
  # yt-dlp. pitch-worker doesn't need it but shares the network for
  # simplicity (one extra worker isn't worth a second Docker network).
  karaoke-internal:

volumes:
  pitch-cache:
